name: Build Quake II Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-2022

    strategy:
      matrix:
        platform: [Win32, x64]
        configuration: [Release]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Build with MSBuild
      run: |
        msbuild q2admin.sln `
          -property:Configuration=${{ matrix.configuration }} `
          -property:Platform=${{ matrix.platform }} `
          -property:VcpkgEnableManifest=true `
          -property:ForceImportBeforeCppTargets="C:\vcpkg\scripts\buildsystems\msbuild\vcpkg.targets" `
          -maxCpuCount

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: q2admin-${{ matrix.platform }}-${{ matrix.configuration }}
        # The ** recursive glob looks into all nested subdirectories for your target files
        path: |
          **/${{ matrix.platform == 'Win32' && 'Release/*.dll' || 'x64/Release/*.dll' }}
