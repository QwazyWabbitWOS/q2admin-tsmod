name: Build Quake II Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-2022

    strategy:
      matrix:
        platform: [Win32, x64]
        configuration: [Release]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up MSBuild
      # Upgraded from v2 to v3 to support Node 24 runners safely
      uses: microsoft/setup-msbuild@v3

    - name: Setup vcpkg and Install Dependencies
      uses: lukka/run-vcpkg@v11
      with:
        runVcpkgInstall: true
        vcpkgGitCommitId: '9edb1b8e590cc086563301d735cae4b6e732d2d2' 

    - name: Build with MSBuild
      run: |
        msbuild your-solution-file.sln `
          -property:Configuration=${{ matrix.configuration }} `
          -property:Platform=${{ matrix.platform }} `
          -maxCpuCount

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: q2admin-${{ matrix.platform }}-${{ matrix.configuration }}
        path: |
          ${{ matrix.platform == 'Win32' && 'q2admin/Release/*.dll' || 'q2admin/x64/Release/*.dll' }}
