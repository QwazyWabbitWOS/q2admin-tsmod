name: Build Quake II Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Set global environment settings for the entire run window
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: windows-2022

    strategy:
      matrix:
        platform: [Win32, x64]
        configuration: [Release]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2
      with:
        submodules: true

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup vcpkg and Install Dependencies
      uses: lukka/run-vcpkg@v11
      with:
        runVcpkgInstall: true

    - name: Build with MSBuild
      run: |
        msbuild q2admin.sln `
          -property:Configuration=${{ matrix.configuration }} `
          -property:Platform=${{ matrix.platform }} `
          -maxCpuCount

    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: q2admin-${{ matrix.platform }}-${{ matrix.configuration }}
        path: |
          ${{ matrix.platform == 'Win32' && 'q2admin/Release/*.dll' || 'q2admin/x64/Release/*.dll' }}
