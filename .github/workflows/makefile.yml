name: Linux Build CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libpcre2-dev

    - name: Build 64-bit Binary
      run: make all

    - name: Build 32-bit Binary (Optional Multi-arch support)
      run: |
        sudo apt-get install -y gcc-multilib g++-multilib
        setarch i386 make clean
        setarch i386 make all
