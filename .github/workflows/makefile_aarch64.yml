name: Linux aarch64 Cross-Compile & Artifact Upload

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-aarch64:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Cross-Compilation Toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: Set up arm64 dependencies
      run: |
        # Enable multiarch to pull arm64 packages on an amd64 host
        sudo dpkg --add-architecture arm64
        sudo apt-get update
        sudo apt-get install -y libpcre2-dev:arm64

    - name: Build for aarch64
      # Command-line assignment overrides internal 'CC=gcc' variables safely
      run: make all CC=aarch64-linux-gnu-gcc

    - name: Upload aarch64 Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gamearch64-linux-artifact
        path: gamearch64.so
        if-no-files-found: error
